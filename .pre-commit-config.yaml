---

# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks

repos:
  - repo: "https://github.com/pre-commit/pre-commit-hooks"
    rev: "v4.4.0"
    hooks:
      # "Check for added large files"
      - id: "check-added-large-files"
      # "Check for merge conflicts"
      - id: "check-merge-conflict"
      # "Check Yaml"
      - id: "check-yaml"
        args:
          # Allow custom tags like Gitlab's "!reference" tag.
          - "--unsafe"
        exclude: "^helm/.+/templates/"
      - id: "end-of-file-fixer"
        exclude: "^helm/.+/(README.md|.*.svg)"
      # "fix python encoding pragma"
      - id: "fix-encoding-pragma"
        args:
          - "--remove"
      # "Trim Trailing Whitespace"
      - id: "trailing-whitespace"

  - repo: "https://github.com/norwoodj/helm-docs"
    rev: "v1.12.0"
    hooks:
    - id: helm-docs
      args:
        - --chart-search-root=helm
      description: Uses 'helm-docs' to create documentation from the Helm chart's 'values.yaml' file, and inserts the result into a corresponding 'README.md' file.
      language: script
      name: Helm Docs
      require_serial: true

    # "Commit messages"
  - repo: "https://github.com/compilerla/conventional-pre-commit"
    rev: "v2.4.0"
    hooks:
      - id: "conventional-pre-commit"
        stages: ["commit-msg"]

  - repo: "https://git.knut.univention.de/univention/infrastructure/pre-commit-hooks/check-issue-reference"
    rev: "v1.0.1"
    hooks:
      - id: "check-issue-reference"
        name: "Check issue reference"

  - repo: "https://git.knut.univention.de/univention/infrastructure/pre-commit-hooks/addlicense"
    rev: "v1.0.1"
    hooks:
      - id: "addlicense"
        name: "Check or add license headers to files"
        types_or:
          - "dockerfile"
          - "python"
          - "yaml"

  - repo: "https://git.knut.univention.de/univention/customers/dataport/upx/kyverno-test-pre-commit"
    rev: "v0.2.0"
    hooks:
      - id: "kyverno-test"

...
