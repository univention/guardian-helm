{{- if .Values.provisioning.enabled }}
---

apiVersion: "v1"
kind: ConfigMap
metadata:
  name: {{ printf "%s-provisioning-config" (include "common.names.fullname" .) }}
  namespace: {{ include "common.names.namespace" . | quote }}
  labels:
    {{- include "common.labels.standard" . | nindent 4 }}
    {{- if .Values.provisioning.extraLabels }}
    {{- include "common.tplvalues.render" ( dict "value" .Values.provisioning.extraLabels "context" . ) | nindent 4 }}
    {{- end }}
  {{- if .Values.provisioning.extraAnnotations }}
  annotations: {{- include "common.tplvalues.render" ( dict "value" .Values.provisioning.extraAnnotations "context" . ) | nindent 4 }}
  {{- end }}

data:
  configure.sh: |
    #!/bin/sh

    cat >/app/values.yaml <<EOF
    config:
      keycloak:
        adminUser: {{ include "guardian.provisioning.config.keycloak.admin" . }}
        adminPassword: "${KEYCLOAK_ADMIN_PASSWORD}"
        realm: {{ include "guardian.provisioning.config.keycloak.realm" . }}
        intraCluster:
          enabled: true
          internalBaseUrl: {{ include "guardian.provisioning.config.keycloak.url" . }}
      custom:
        clients:
          - name: "guardian-management-api"
            clientId: "guardian-management-api"
            rootUrl: {{ include "guardian.provisioning.config.nubusBaseUrl" . }}
            baseUrl: {{ include "guardian.provisioning.config.nubusBaseUrl" . }}
            protocol: "openid-connect"
            publicClient: false
            clientAuthenticatorType: "client-secret"
            secret: "${GUARDIAN_MANAGEMENT_API_CLIENT_SECRET}"
            redirectUris:
              - {{ printf "%s/guardian/*" (include "guardian.provisioning.config.nubusBaseUrl" .) }}
            fullScopeAllowed: true
            standardFlowEnabled: true
            implicitFlowEnabled: false
            directAccessGrantsEnabled: false
            serviceAccountsEnabled: true
            protocolMappers:
              - name: "Client Host"
                protocol: "openid-connect"
                protocolMapper: "oidc-usersessionmodel-note-mapper"
                consentRequired: false
                config:
                  user.session.note: "clientHost"
                  userinfo.token.claim: true
                  id.token.claim: true
                  access.token.claim: true
                  claim.name: "clientHost"
                  jsonType.label: "String"
              - name: "Client ID"
                protocol: "openid-connect"
                protocolMapper: "oidc-usersessionmodel-note-mapper"
                consentRequired: false
                config:
                  user.session.note: "client_id"
                  userinfo.token.claim: true
                  id.token.claim: true
                  access.token.claim: true
                  claim.name: "client_id"
                  jsonType.label: "String"
              - name: "guardian-audience"
                protocol: "openid-connect"
                protocolMapper: "oidc-audience-mapper"
                consentRequired: false
                config:
                  included.client.audience: "guardian"
                  userinfo.token.claim: false
                  id.token.claim: false
                  access.token.claim: true
              - name: "audiencemap"
                protocol: "openid-connect"
                protocolMapper: "oidc-audience-mapper"
                consentRequired: false
                config:
                  included.client.audience: "guardian-cli"
                  userinfo.token.claim: true
                  id.token.claim: true
                  access.token.claim: true
              - name: "dn"
                protocol: "openid-connect"
                protocolMapper: "oidc-usermodel-attribute-mapper"
                consentRequired: false
                config:
                  userinfo.token.claim: false
                  user.attribute: "LDAP_ENTRY_DN"
                  id.token.claim: false
                  access.token.claim: true
                  claim.name: "dn"
                  jsonType.label: "String"
              - name: "username"
                protocol: "openid-connect"
                protocolMapper: "oidc-usermodel-property-mapper"
                consentRequired: false
                config:
                  userinfo.token.claim: true
                  user.attribute: "username"
                  id.token.claim: true
                  access.token.claim: true
                  claim.name: "preferred_username"
                  jsonType.label: "String"
              - name: "uid"
                protocol: "openid-connect"
                protocolMapper: "oidc-usermodel-attribute-mapper"
                consentRequired: false
                config:
                  userinfo.token.claim: true
                  user.attribute: "uid"
                  id.token.claim: true
                  access.token.claim: true
                  claim.name: "uid"
                  jsonType.label: "String"
              - name: "email"
                protocol: "openid-connect"
                protocolMapper: "oidc-usermodel-property-mapper"
                consentRequired: false
                config:
                  userinfo.token.claim: true
                  user.attribute: "email"
                  id.token.claim: true
                  access.token.claim: true
                  claim.name: "email"
                  jsonType.label: "String"
              - name: "Client IP Address"
                protocol: "openid-connect"
                protocolMapper: "oidc-usersessionmodel-note-mapper"
                consentRequired: false
                config:
                  user.session.note: "clientAddress"
                  userinfo.token.claim: true
                  id.token.claim: true
                  access.token.claim: true
                  claim.name: "clientAddress"
                  jsonType.label: "String"
          - name: "guardian-scripts"
            clientId: "guardian-scripts"
            description: ""
            rootUrl: {{ include "guardian.provisioning.config.nubusBaseUrl" . }}
            adminUrl: {{ include "guardian.provisioning.config.nubusBaseUrl" . }}
            baseUrl: {{ include "guardian.provisioning.config.nubusBaseUrl" . }}
            surrogateAuthRequired: false
            enabled: true
            alwaysDisplayInConsole: false
            clientAuthenticatorType: "client-secret"
            redirectUris:
              - {{ printf "%s/univention/guardian/*" (include "guardian.provisioning.config.nubusBaseUrl" .) }}
              - {{ include "guardian.provisioning.config.nubusBaseUrl" . }}
              - {{ printf "%s/guardian/*" (include "guardian.provisioning.config.nubusBaseUrl" .) }}
            webOrigins:
              - {{ include "guardian.provisioning.config.nubusBaseUrl" . }}
            bearerOnly: false
            consentRequired: false
            standardFlowEnabled: true
            implicitFlowEnabled: false
            directAccessGrantsEnabled: true
            serviceAccountsEnabled: false
            publicClient: true
            frontchannelLogout: false
            protocol: "openid-connect"
            fullScopeAllowed: true
            protocolMappers:
              - name: "email"
                protocol: "openid-connect"
                protocolMapper: "oidc-usermodel-property-mapper"
                consentRequired: false
                config:
                  userinfo.token.claim: true
                  user.attribute: "email"
                  id.token.claim: true
                  access.token.claim: true
                  claim.name: "email"
                  jsonType.label: "String"
              - name: "guardian-audience"
                protocol: "openid-connect"
                protocolMapper: "oidc-audience-mapper"
                consentRequired: false
                config:
                  included.client.audience: "guardian"
                  id.token.claim: false
                  access.token.claim: true
                  userinfo.token.claim: false
              - name: "username"
                protocol: "openid-connect"
                protocolMapper: "oidc-usermodel-property-mapper"
                consentRequired: false
                config:
                  userinfo.token.claim: true
                  user.attribute: "username"
                  id.token.claim: true
                  access.token.claim: true
                  claim.name: "preferred_username"
                  jsonType.label: "String"
              - name: "uid"
                protocol: "openid-connect"
                protocolMapper: "oidc-usermodel-attribute-mapper"
                consentRequired: false
                config:
                  userinfo.token.claim: true
                  user.attribute: "uid"
                  id.token.claim: true
                  access.token.claim: true
                  claim.name: "uid"
                  jsonType.label: "String"
              - name: "audiencemap"
                protocol: "openid-connect"
                protocolMapper: "oidc-audience-mapper"
                consentRequired: false
                config:
                  included.client.audience: "guardian-scripts"
                  id.token.claim: true
                  access.token.claim: true
                  userinfo.token.claim: true
              - name: "dn"
                protocol: "openid-connect"
                protocolMapper: "oidc-usermodel-attribute-mapper"
                consentRequired: false
                config:
                  aggregate.attrs: false
                  multivalued: false
                  userinfo.token.claim: false
                  user.attribute: "LDAP_ENTRY_DN"
                  id.token.claim: false
                  access.token.claim: true
                  claim.name: "dn"
                  jsonType.label: "String"
            defaultClientScopes:
              - "opendesk"
              - "web-origins"
              - "acr"
              - "roles"
              - "profile"
              - "email"
            optionalClientScopes:
              - "address"
              - "phone"
              - "offline_access"
              - "microprofile-jwt"
          - name: "guardian-ui"
            clientId: "guardian-ui"
            rootUrl: {{ include "guardian.provisioning.config.nubusBaseUrl" . }}
            baseUrl: {{ include "guardian.provisioning.config.nubusBaseUrl" . }}
            clientAuthenticatorType: "client-secret"
            redirectUris:
              - {{ printf "%s/univention/guardian/*" (include "guardian.provisioning.config.nubusBaseUrl" .) }}
            standardFlowEnabled: true
            publicClient: true
            implicitFlowEnabled: false
            directAccessGrantsEnabled: false
            serviceAccountsEnabled: false
            protocol: "openid-connect"
            fullScopeAllowed: true
            protocolMappers:
              - name: "uid"
                protocol: "openid-connect"
                protocolMapper: "oidc-usermodel-attribute-mapper"
                consentRequired: false
                config:
                  userinfo.token.claim: true
                  user.attribute: "uid"
                  id.token.claim: true
                  access.token.claim: true
                  claim.name: "uid"
                  jsonType.label: "String"
              - name: "username"
                protocol: "openid-connect"
                protocolMapper: "oidc-usermodel-property-mapper"
                consentRequired: false
                config:
                  userinfo.token.claim: true
                  user.attribute: "username"
                  id.token.claim: true
                  access.token.claim: true
                  claim.name: "preferred_username"
                  jsonType.label: "String"
              - name: "dn"
                protocol: "openid-connect"
                protocolMapper: "oidc-usermodel-attribute-mapper"
                consentRequired: false
                config:
                  userinfo.token.claim: "false"
                  user.attribute: "LDAP_ENTRY_DN"
                  id.token.claim: false
                  access.token.claim: true
                  claim.name: "dn"
                  jsonType.label: "String"
              - name: "audiencemap"
                protocol: "openid-connect"
                protocolMapper: "oidc-audience-mapper"
                consentRequired: false
                config:
                  included.client.audience: "guardian"
                  id.token.claim: true
                  access.token.claim: true
                  userinfo.token.claim: true
              - name: "email"
                protocol: "openid-connect"
                protocolMapper: "oidc-usermodel-property-mapper"
                consentRequired: false
                config:
                  userinfo.token.claim: true
                  user.attribute: "email"
                  id.token.claim: true
                  access.token.claim: true
                  claim.name: "email"
                  jsonType.label: "String"
              - name: "guardian-audience"
                protocol: "openid-connect"
                protocolMapper: "oidc-audience-mapper"
                consentRequired: false
                config:
                  included.client.audience: "guardian"
                  id.token.claim: false
                  access.token.claim: true
                  userinfo.token.claim: false
    EOF

    /app/entrypoint.sh

...
---


apiVersion: "v1"
kind: ConfigMap
metadata:
  name: {{ printf "%s-provisioning-init" (include "common.names.fullname" .) }}
  namespace: {{ include "common.names.namespace" . | quote }}
  labels:
    {{- include "common.labels.standard" . | nindent 4 }}
    {{- if .Values.provisioning.extraLabels }}
    {{- include "common.tplvalues.render" ( dict "value" .Values.provisioning.extraLabels "context" . ) | nindent 4 }}
    {{- end }}
  {{- if .Values.provisioning.extraAnnotations }}
  annotations: {{- include "common.tplvalues.render" ( dict "value" .Values.provisioning.extraAnnotations "context" . ) | nindent 4 }}
  {{- end }}

data:
  KEYCLOAK_URL: {{ include "guardian.provisioning.config.keycloak.url" . | quote }}
  wait-for-keycloak.py: |
    #!/usr/bin/python3
    import requests
    import time
    import sys
    import os

    keycloak_url = os.environ.get('KEYCLOAK_URL')
    max_retries = 60
    retries = 0

    while True:
        try:
            response = requests.get(keycloak_url)
            if response.status_code == 200:
                print('Keycloak is available')
                sys.exit(0)
        except requests.exceptions.ConnectionError:
            print('Could not reach keycloak, retrying...')
            pass
        time.sleep(1)

...

{{- end }}
