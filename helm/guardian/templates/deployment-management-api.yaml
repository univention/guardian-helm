---
apiVersion: {{ include "common.capabilities.deployment.apiVersion" . }}
kind: Deployment
metadata:
  name: {{ printf "%s-management-api" (include "common.names.fullname" .) }}
  namespace: {{ include "common.names.namespace" . | quote }}
  labels:
    {{- include "common.labels.standard" ( dict "customLabels" .Values.additionalLabels "context" . ) | nindent 4 }}
  {{- include "nubus-common.annotations.render" ( dict
    "values" ( list .Values.additionalAnnotations )
    "context" . )
    | nindent 2 }}
spec:
  replicas: {{ .Values.managementApi.replicaCount }}
  selector:
    matchLabels:
      {{- $commonLabels := include "common.labels.matchLabels" . | fromYaml }}
      {{- $uiLabels := dict "app.kubernetes.io/name" (printf "%s-management-api" (include "common.names.fullname" .)) }}
      {{- merge $uiLabels $commonLabels | toYaml | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap-management-api.yaml") . | sha256sum }}
        {{- with .Values.managementApi.podAnnotations }}
          {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- $commonLabels := include "common.labels.standard" . | fromYaml }}
        {{- $uiLabels := dict "app.kubernetes.io/name" (printf "%s-management-api" (include "common.names.fullname" .)) }}
        {{- $mergedLabels := merge $uiLabels $commonLabels }}
        {{- toYaml $mergedLabels | nindent 8 }}
    spec:
      {{- if .Values.serviceAccount.create }}
      serviceAccountName: {{ include "common.names.fullname" . }}
      {{- end }}
      {{- with .Values.managementApi.affinity }}
      affinity:
        {{ toYaml . | nindent 8 | trim }}
      {{- end }}
      {{- with .Values.managementApi.tolerations }}
      tolerations:
        {{ toYaml . | nindent 8 | trim }}
      {{- end }}
      {{- with .Values.managementApi.nodeSelector }}
      nodeSelector:
        {{ toYaml . | nindent 8 | trim }}
      {{- end }}
      {{- if .Values.managementApi.podSecurityContext.enabled }}
      securityContext:
        {{- omit .Values.managementApi.podSecurityContext "enabled" | toYaml | nindent 8 }}
      {{- end }}
      {{- if or .Values.imagePullSecrets .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- range .Values.global.imagePullSecrets }}
        - name: "{{ . }}"
        {{- end }}
        {{- range .Values.imagePullSecrets }}
        - name: "{{ . }}"
        {{- end }}
      {{- end }}
      initContainers:
        - name: "database-migrations"
          image: "{{ coalesce .Values.managementApi.image.registry .Values.global.imageRegistry }}/{{ .Values.managementApi.image.repository }}{{ if .Values.managementApi.image.sha256 }}@sha256:{{ .Values.managementApi.image.sha256 }}{{ else }}:{{ .Values.managementApi.image.tag }}{{ end }}"
          command: ["alembic", "upgrade", "head"]
          imagePullPolicy: {{ coalesce .Values.managementApi.image.pullPolicy .Values.global.imagePullPolicy | quote }}
          {{- if .Values.managementApi.containerSecurityContext.enabled }}
          securityContext:
            {{- omit .Values.managementApi.containerSecurityContext "enabled" | toYaml | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.managementApi.resources | nindent 12 }}
          envFrom:
            - configMapRef:
                name: {{ printf "%s-management-api" (include "common.names.fullname" .) }}
          env:
            - name: "SQL_PERSISTENCE_ADAPTER__PASSWORD"
              valueFrom:
                secretKeyRef:
                  name: {{ include "nubus-common.secrets.name" (dict "existingSecret" .Values.postgresql.auth.existingSecret "defaultNameSuffix" "management-api-postgresql-credentials" "context" .) }}
                  key: {{ include "nubus-common.secrets.key" (dict "existingSecret" .Values.postgresql.auth.existingSecret "key" "password" "context" .) }}
      containers:
        - name: "main"
          {{- if .Values.managementApi.containerSecurityContext.enabled }}
          securityContext:
            {{- omit .Values.managementApi.containerSecurityContext "enabled" | toYaml  | nindent 12 }}
          {{- end }}
          image: "{{ coalesce .Values.managementApi.image.registry .Values.global.imageRegistry }}/{{ .Values.managementApi.image.repository }}{{ if .Values.managementApi.image.sha256 }}@sha256:{{ .Values.managementApi.image.sha256 }}{{ else }}:{{ .Values.managementApi.image.tag }}{{ end }}"
          imagePullPolicy: {{ coalesce .Values.managementApi.image.pullPolicy .Values.global.imagePullPolicy | quote }}
          envFrom:
            - configMapRef:
                name: {{ printf "%s-management-api" (include "common.names.fullname" .) }}
          env:
            - name: "SQL_PERSISTENCE_ADAPTER__PASSWORD"
              valueFrom:
                secretKeyRef:
                  name: {{ include "nubus-common.secrets.name" (dict "existingSecret" .Values.postgresql.auth.existingSecret "defaultNameSuffix" "management-api-postgresql-credentials" "context" .) }}
                  key: {{ include "nubus-common.secrets.key" (dict "existingSecret" .Values.postgresql.auth.existingSecret "key" "password" "context" .) }}
          ports:
            {{- range $key, $value := .Values.managementApi.service.ports }}
            - name: {{ $key }}
              containerPort: {{ $value.containerPort }}
              protocol: {{ $value.protocol }}
            {{- end }}
          {{- if .Values.managementApi.probes.liveness.enabled }}
          livenessProbe:
            httpGet:
              path: /guardian/management/openapi.json
              port: http
            initialDelaySeconds: {{ .Values.managementApi.probes.liveness.initialDelaySeconds }}
            timeoutSeconds: {{ .Values.managementApi.probes.liveness.timeoutSeconds }}
            periodSeconds: {{ .Values.managementApi.probes.liveness.periodSeconds }}
            failureThreshold: {{ .Values.managementApi.probes.liveness.failureThreshold }}
            successThreshold: {{ .Values.managementApi.probes.liveness.successThreshold }}
          {{- end }}
          {{- if .Values.managementApi.probes.readiness.enabled }}
          readinessProbe:
            httpGet:
              path: /guardian/management/openapi.json
              port: http
            initialDelaySeconds: {{ .Values.managementApi.probes.readiness.initialDelaySeconds }}
            timeoutSeconds: {{ .Values.managementApi.probes.readiness.timeoutSeconds }}
            periodSeconds: {{ .Values.managementApi.probes.readiness.periodSeconds }}
            failureThreshold: {{ .Values.managementApi.probes.readiness.failureThreshold }}
            successThreshold: {{ .Values.managementApi.probes.readiness.successThreshold }}
          {{- end }}
          resources:
            {{- toYaml .Values.managementApi.resources | nindent 12 }}
          volumeMounts:
            - name: "secrets"
              mountPath: "/var/secrets/oauthAdapterM2mSecret"
              subPath: {{ include "nubus-common.secrets.key" (dict "existingSecret" .Values.managementApi.oauth.auth.existingSecret "key" "clientSecret" "context" .) }}
            - name: "bundles"
              mountPath: "/guardian_service_dir/bundle_server"
            - name: "tmp"
              mountPath: "/tmp"
            {{- if .Values.managementApi.extraVolumeMounts }}
            {{- include "common.tplvalues.render" (dict "value" .Values.managementApi.extraVolumeMounts "context" .) | nindent 12 }}
            {{- end }}
      volumes:
        - name: "bundles"
          emptyDir: {}
        - name: "tmp"
          emptyDir: {}
        - name: "secrets"
          secret:
            secretName: {{ include "nubus-common.secrets.name" (dict "existingSecret" .Values.managementApi.oauth.auth.existingSecret "defaultNameSuffix" "keycloak-client-secret" "context" .) }}
        {{- if .Values.managementApi.extraVolumes }}
          {{- include "common.tplvalues.render" (dict "value" .Values.managementApi.extraVolumes  "context" .) | nindent 8 }}
        {{- end }}

...
