{{- if not (.Values.managementApi.oauth.auth.existingSecret).name }}

{{- $secretName := (include "nubus-common.secrets.name" (dict "defaultNameSuffix" "keycloak-client-secret" "context" .)) }}
{{- $password := include "nubus-common.secrets.passwords.manage"
  (dict
    "secret" $secretName
    "key" "password"
    "username" "nubus"
    "site" "guardian-keycloak-client-secret"
    "providedValues" (list "managementApi.oauth.auth.clientSecret")
    "context" .
  )
}}

---
kind: "Secret"
apiVersion: "v1"
metadata:
  name: {{ $secretName | quote }}
  namespace: {{ include "common.names.namespace" . | quote }}
  labels:
    {{- include "common.labels.standard" ( dict "customLabels" .Values.additionalLabels "context" . ) | nindent 4 }}
  {{- $extraAnnotations := dict }}
  {{- if (.Values.global.secrets).keep }}
    {{- $_ := set $extraAnnotations "helm.sh/resource-policy" "keep" }}
  {{- end }}
  {{- include "nubus-common.annotations.render" ( dict
    "values" ( list $extraAnnotations .Values.additionalAnnotations )
    "context" . )
    | nindent 2 }}
stringData:
  clientSecret: {{ $password | quote }}
{{- end }}
