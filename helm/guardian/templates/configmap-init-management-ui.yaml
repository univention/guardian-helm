---

apiVersion: "v1"
kind: ConfigMap
metadata:
  name: {{ printf "%s-init-config-management-ui" (include "common.names.fullname" .) }}
  namespace: {{ include "common.names.namespace" . | quote }}
  labels:
    {{- include "common.labels.standard" . | nindent 4 }}
    {{- if .Values.managementUi.additionalLabels }}
    {{- include "common.tplvalues.render" ( dict "value" .Values.managementUi.additionalLabels "context" . ) | nindent 4 }}
    {{- end }}
  {{- if .Values.managementUi.additionalAnnotations }}
  annotations: {{- include "common.tplvalues.render" ( dict "value" .Values.managementUi.additionalAnnotations "context" . ) | nindent 4 }}
  {{- end }}

data:
  10-generate_config.sh: |
    #!/bin/bash

    set -eo pipefail

    env_variable_names=$(compgen -e)
    config='{}'

    for variable_name in $env_variable_names; do
        if [[ "$variable_name" == VITE__* ]]; then
            config=$(echo "$config" | jq --arg value "${!variable_name}" ".$variable_name = \$value")
        fi
    done
    echo "$config" > /app/config.json
...
---

apiVersion: "v1"
kind: ConfigMap
metadata:
  name: {{ printf "%s-nginx-conf" (include "common.names.fullname" .) }}
  namespace: {{ include "common.names.namespace" . | quote }}
  labels:
    {{- include "common.labels.standard" . | nindent 4 }}
    {{- if .Values.managementUi.additionalLabels }}
    {{- include "common.tplvalues.render" ( dict "value" .Values.managementUi.additionalLabels "context" . ) | nindent 4 }}
    {{- end }}
  {{- if .Values.managementUi.additionalAnnotations }}
  annotations: {{- include "common.tplvalues.render" ( dict "value" .Values.managementUi.additionalAnnotations "context" . ) | nindent 4 }}
  {{- end }}

data:
  nginx.conf: |
    server {
     listen 8383;
     server_name management-ui;
     root /app;
     location /univention/guardian/management-ui {
       alias /app/;
       try_files $uri /index.html;
     }

     location /univention/guardian/management-ui/favicon.ico {
       alias /app/favicon.ico;
       try_files $uri =404;
     }
     location /univention/guardian/management-ui/config.json {
       alias /app/config.json;
       try_files $uri =404;
     }

     location /univention/guardian/management-ui/assets/ {
       alias /app/assets/;
       try_files $uri =404;
     }
    }
...
