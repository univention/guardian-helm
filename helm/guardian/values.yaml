################
# provisioning #
################

# -- The Guardian Keycloak provisioning job
provisioning:
  # -- Whether to run the provisioning job to create the Guardian clients in Keycloak or not.
  enabled: true
  restartPolicy: "OnFailure"
  backoffLimit: 900
  # -- Time in seconds until the job gets deleted
  ttlSecondsAfterFinished: 300
  podSecurityContext:
    fsGroup: 1000
    # -- Change ownership and permission of the volume before being exposed inside a Pod.
    fsGroupChangePolicy: "Always"


  provisioningImage:
    imagePullSecrets: []

    registry: "registry.opencode.de"
    repository: "bmi/opendesk/components/platform-development/images/opendesk-keycloak-bootstrap"
    tag: "1.0.5@sha256:76ccd9a74ae2c2dabb6beaa0192c15b9c06763abbd632cd0f8db68e5d8d5883c"


  image:
    imagePullSecrets: []

    registry: ""
    repository: "nubus-dev/images/guardian-init"
    tag: "latest"
    # -- Define image sha256 as an alternative to `tag`
    sha256: null

  config:
    # -- Base URL for setting in Keycloak application URL without backslash.
    # Example: "https://portal.uv-example.gaia.open-desk.cloud"
    nubusBaseUrl: ""
    # -- Keycloak specific settings.
    keycloak:
      # -- Internal URL to reach Keycloak for provisioning.
      # Example: "http://keycloak:8080"
      url: ""
      # -- Fully qualified domain name for Keycloak.
      # Example: "id.uv-example.gaia.open-desk.cloud"
      fqdn: ""
      # -- Realm where the Guardian clients should be created.
      # Example: "nubus"
      realm: ""
      # -- Keycloak admin user for the master realm.
      # Example: "kcadmin"
      admin: ""
      # -- Specify this only if you do not want to use a secret (see below).
      password: ""
      credentialSecret:
        # -- The key in which the Keycloak admin password is stored in the secret.
        # Example: "adminPassword"
        key: ""
    # -- Management API settings for the provisioning job
    managementApi:
      # -- Specify this only if you do not want to use a secret (see below).
      clientSecret: ""
      # -- The name of a secret that contains `managementApiClientSecret`.
      # Example: "managementApiClientSecret"
      credentialSecret:
        key: ""

  securityContext:
    allowPrivilegeEscalation: false
    privileged: false
    readOnlyRootFilesystem: false
    runAsGroup: 1000
    runAsNonRoot: true
    runAsUser: 1000
    seccompProfile:
      type: RuntimeDefault
  tolerations: []

#######################
# END OF PROVISIONING #
#######################


##############
# POSTGRESQL #
##############

# -- PostgreSQL settings.
#
# The bitnami helm chart does contain all details of what can be configured:
# https://github.com/bitnami/charts/tree/main/bitnami/postgresql
postgresql:
  nameOverride: "guardian-postgresql"
  # -- Set to `true` if you want PostgreSQL to be installed as well.
  bundled: false
  # -- Connection parameters. These are required if you use an external database.
  connection:
    host:
    port:
  auth:
    username: ""
    database: ""
    password: ""
    credentialSecret:
      name: ""
      key: "password"


