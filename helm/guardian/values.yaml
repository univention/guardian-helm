################
# provisioning #
################

# -- The Guardian Keycloak provisioning job
provisioning:
  # -- Whether to run the provisioning job to create the Guardian clients in Keycloak or not.
  enabled: true
  restartPolicy: "OnFailure"
  backoffLimit: 900
  # -- Time in seconds until the job gets deleted
  ttlSecondsAfterFinished: 300
  podSecurityContext:
    enabled: true
    fsGroup: 1000
    # -- Change ownership and permission of the volume before being exposed inside a Pod.
    fsGroupChangePolicy: "Always"

  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "500m"

  provisioningImage:
    registry: null
    repository: "nubus/images/keycloak-bootstrap"
    tag: "0.19.12@sha256:1b368a4964a124b67b6bed64d5da9c17c84b34c124767ee248e8de93f1c8c9f4"
    pullPolicy: null

  image:
    registry: null
    repository: "nubus/images/wait-for-dependency"
    tag: "0.35.27@sha256:3f9f37e224a7a8e268ee2cdf1ca8d18826d2d0d5b356a2a5a3cbfa4968a2a281"
    # -- Define image sha256 as an alternative to `tag`
    sha256: null

  # -- Keycloak specific settings.
  keycloak:
    # -- Keycloak realm.
    realm: ""
    auth:
      # -- Keycloak user.
      username: ""
      # -- Keycloak password.
      password: ""
      # -- Keycloak password secret reference.
      existingSecret:
        name: null
        keyMapping:
          adminPassword: null
    # -- Connection parameters.
    connection:
      # -- Keycloak host.
      host: ""
      # -- Keycloak port.
      port: ""

  config:
    # -- Base URL for setting in Keycloak application URL without backslash.
    # Example: "https://portal.uv-example.gaia.open-desk.cloud"
    nubusBaseUrl: ""
    # Debugging related settings
    debug:
      # -- Enable debug output of included Ansible scripts
      enabled: false
      # -- Seconds for the job to pause before starting the actual bootstrapping.
      pauseBeforeScriptStart: 0

  containerSecurityContext:
    enabled: true
    capabilities:
      drop:
      - ALL
    allowPrivilegeEscalation: false
    privileged: false
    readOnlyRootFilesystem: true
    runAsGroup: 1000
    runAsNonRoot: true
    runAsUser: 1000
    seccompProfile:
      type: RuntimeDefault
  tolerations: []

#######################
# END OF PROVISIONING #
#######################


##############
# POSTGRESQL #
##############

# -- PostgreSQL settings.
#
# Configuration of the postgresql connection
postgresql:
  # -- Connection parameters. These are required if you use an external database.
  connection:
    host:
    port:
  auth:
    username: ""
    database: ""
    # -- Password for authenticating against the PostgreSQL database. Either this value
    # or an existing Secret has to be specified.
    password: ""
    existingSecret:
      # -- The name of an existing Secret to use for retrieving the password
      name: null
      keyMapping:
        # -- The key to retrieve the password from. Setting this value allows
        # to use a key with a different name than the default "password".
        password: null

#################
# EXTRA SECRETS #
#################

# -- Optionally specify a secret to create (primarily intended to be used in development environments to provide custom certificates)
extraSecrets: []

  # - name: "guardian-udm-secret"
  #   stringData:
  #     udmDataAdapterUsername: "cn=admin"
  #     udmDataAdapterPassword: "password"

  # - name: "guardian-keycloak-client-secret"
  #   stringData:
  #     oauthAdapterM2mSecret: "stub_client_secret"

  # - name: "guardian-provisioning-secret"
  #   stringData:
  #     adminPassword: "stub_password"
  #     managementApiClientSecret: "stub_client_secret"

# -- Array with extra environment variables to add to containers.
#
# extraEnvVars:
#   - name: FOO
#     value: "bar"
extraEnvVars: []

# -- Optionally specify an extra list of additional volumes.
extraVolumes: []

# -- Optionally specify an extra list of additional volumeMounts.
extraVolumeMounts: []

# Service account to use.
# Ref.: https://kubernetes.io/docs/tasks/configure-pod-container/configure-service-account/
serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""
  ## @param serviceAccount.automountServiceAccountToken Allows auto mount of ServiceAccountToken on the serviceAccount created
  ## Can be set to false if pods using this serviceAccount do not need to use K8s API
  ##
  automountServiceAccountToken: false
  # -- Additional custom labels for the ServiceAccount.
  labels: {}


...
