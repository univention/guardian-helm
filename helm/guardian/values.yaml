################
# provisioning #
################

# -- The Guardian Keycloak provisioning job
provisioning:
  # -- Whether to run the provisioning job to create the Guardian clients in Keycloak or not.
  enabled: true
  restartPolicy: "OnFailure"
  backoffLimit: 900
  # -- Time in seconds until the job gets deleted
  ttlSecondsAfterFinished: 300
  podSecurityContext:
    fsGroup: 1000
    # -- Change ownership and permission of the volume before being exposed inside a Pod.
    fsGroupChangePolicy: "Always"

  provisioningImage:
    imagePullSecrets: []

    registry: "artifacts.software-univention.de"
    repository: "nubus/images/keycloak-bootstrap"
    tag: "0.1.2"
    imagePullPolicy: "IfNotPresent"

  image:
    imagePullSecrets: []

    registry: "artifacts.software-univention.de"
    repository: "nubus-dev/images/guardian-init"
    tag: "latest"
    # -- Define image sha256 as an alternative to `tag`
    # sha256: null

  config:
    # -- Base URL for setting in Keycloak application URL without backslash.
    # Example: "https://portal.uv-example.gaia.open-desk.cloud"
    nubusBaseUrl: ""
    # -- Keycloak specific settings.
    keycloak:
      # -- Keycloak user.
      username: ""
      # -- Keycloak password.
      password: ""
      # -- Keycloak realm.
      realm: ""
      # -- Keycloak password secret reference.
      credentialSecret:
        name: ""
        key: "password"
      # -- Connection parameters.
      connection:
        # -- Keycloak host.
        host: ""
        # -- Keycloak port.
        port: ""

    # Debugging related settings
    debug:
      # -- Enable debug output of included Ansible scripts
      enabled: false
      # -- Seconds for the job to pause before starting the actual bootstrapping.
      pauseBeforeScriptStart: 0
    # -- Management API settings for the provisioning job
    managementApi:
      # -- Specify this only if you do not want to use a secret (see below).
      clientSecret: ""
      # -- The name of a secret that contains `managementApiClientSecret`.
      # Example: "managementApiClientSecret"
      credentialSecret:
        key: ""

  securityContext:
    allowPrivilegeEscalation: false
    privileged: false
    readOnlyRootFilesystem: false
    runAsGroup: 1000
    runAsNonRoot: true
    runAsUser: 1000
    seccompProfile:
      type: RuntimeDefault
  tolerations: []

#######################
# END OF PROVISIONING #
#######################


##############
# POSTGRESQL #
##############

# -- PostgreSQL settings.
#
# The bitnami helm chart does contain all details of what can be configured:
# https://github.com/bitnami/charts/tree/main/bitnami/postgresql
postgresql:
  nameOverride: "guardian-postgresql"
  # -- Set to `true` if you want PostgreSQL to be installed as well.
  bundled: false
  # -- Connection parameters. These are required if you use an external database.
  connection:
    host:
    port:
  auth:
    username: ""
    database: ""
    password: ""
    credentialSecret:
      name: ""
      key: "password"


