---

## Global values
global:
  affinity: {}
  environment: {}
  fullnameOverride: ""
  nameOverride: ""
  nodeSelector: {}
  podAnnotations: {}
  podSecurityContext: {}
  replicaCount: 1
  securityContext: {}
  tolerations: []
  imageRegistry: "artifacts.software-univention.de"
  postgresql:
    connection:
      host: ""
      port: ""

  domain: ""
  subDomains:
    keycloak: ""
    portal: "portal"


#########################
# INGRESS CONFIGURATION #
#########################

# Define and create Kubernetes Ingress.
#
# Ref.: https://kubernetes.io/docs/concepts/services-networking/ingress/
ingress:
  # -- Enable creation of Ingress.
  enabled: true

  # -- Define custom ingress annotations for all Ingresses.
  annotations: {}

  # -- Define the Fully Qualified Domain Name (FQDN) where application should be reachable. (This will be the default for all Ingresses)
  host: ""

  # Request certificates via cert-manager.io annotation
  certManager:
    # -- Enable cert-manager.io annotaion.
    enabled: true

    # Issuer reference.
    issuerRef:
      # -- Name of cert-manager.io Issuer resource.
      name: ""
      # -- Type of Issuer, f.e. "Issuer" or "ClusterIssuer".
      kind: "ClusterIssuer"

  # -- The Ingress controller class name. (This will be the default for all Ingresses)
  ingressClassName: ""

  # -- Secure an Ingress by specifying a Secret that contains a TLS private key and certificate.
  #
  # Ref.: https://kubernetes.io/docs/concepts/services-networking/ingress/#tls
  tls:
    # -- Enable TLS/SSL/HTTPS for Ingress.
    enabled: true

    # -- The name of the kubernetes secret which contains a TLS private key and certificate.
    # Hint: This secret is not created by this chart and must be provided.
    secretName: ""
  items:
    - name: management-ui
      host: ""
      # -- Define the Ingress paths.
      paths:
        - path: /univention/guardian/management-ui
          pathType: Prefix
          backend:
            service:
              name: guardian-management-ui
              port:
                number: 80
      ingressClassName: ""
      annotations: {}
      tls:
        # enabled: true
        secretName: ""
    - name: management-api
      host: ""
      paths:
        - path: /guardian/management
          pathType: Prefix
          backend:
            service:
              name: guardian-management-api
              port:
                number: 80
      ingressClassName: ""
      annotations: {}
      tls:
        # enabled: true
        secretName: ""
    - name: authorization-api
      host: ""
      paths:
        - path: /guardian/authorization
          pathType: Prefix
          backend:
            service:
              name: guardian-authorization-api
              port:
                number: 80
      ingressClassName: ""
      annotations: {}
      tls:
        # enabled: true
        secretName: ""

# -- Extra ingress configuration
extraIngresses: []
# example:
  # - name: custom
  #   host: ""
  #   paths:
  #     - pathType: Exact
  #       path: /custom
  #   ingressClassName: ""
  #   annotations: {}
  #   tls:
  #     enabled: true
  #     secretName: ""

#####################
# AUTHORIZATION API #
#####################

# -- The Guardian authorization API
authorizationApi:
  affinity: {}
  environment: {}
  fullnameOverride: ""
  nameOverride: ""
  nodeSelector: {}
  podAnnotations: {}
  podSecurityContext:
    fsGroup: 1000
    # -- Change ownership and permission of the volume before being exposed inside a Pod.
    fsGroupChangePolicy: "Always"
  replicaCount: 1
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
      - ALL
    privileged: false
    readOnlyRootFilesystem: true
    runAsGroup: 1000
    runAsNonRoot: true
    runAsUser: 1000
    seccompProfile:
      type: RuntimeDefault
  tolerations: []

  image:
    imagePullPolicy: "Always"
    imagePullSecrets: []

    registry: "docker.software-univention.de"
    repository: "guardian-authorization-api-authorization-api"
    tag: "2.0.0"
    # -- Define image sha256 as an alternative to `tag`
    sha256: null

  config:
    # -- Directory that Guardian will use to save the bundles and configuration.
    # Example: /guardian_service_dir
    home: "/guardian_service_dir"
    # -- Comma-separated list of hosts that are allowed to make cross-origin resource sharing (CORS) requests to the server.
    # Example: "*"
    guardianAuthzCorsAllowedOrigins: "*"
    # -- Port and adapter to specify where to read the settings from. Defaults to `env` for environment.
    # Example: "env"
    guardianAuthzAdapterSettingsPort: "env"
    # -- Port and adapter to specify where to store the application data.
    # Example: "udm_data"
    guardianAuthzAdapterAppPersistencePort: "udm_data"
    # -- Port and adapter for policies. Defaults to `opa` for Open Policy Agent.
    # Example: "opa"
    guardianAuthzAdapterPolicyPort: "opa"
    # -- Port and adapter for authentication. Use `fast_api_oauth` for integrated OIDC support.
    # Example: "fast_api_oauth"
    guardianAuthzAdapterAuthenticationPort: "fast_api_oauth"
    isUniventionAppCenter: 0
    # -- The URL of the UDM REST API for data queries.
    # Example: "http://udm-rest-api/univention/udm"
    udmDataAdapterUrl: ''
    # -- Username for authenticating against the UDM REST API
    # Do not use, see `secretRef` below.
    # Example: "cn=admin"
    udmDataAdapterUsername: ""
    # -- File where the UDM username will be stored.
    # Example: "/var/secrets/udmDataAdapterUsername"
    udmDataAdapterUsernameFile: "/var/secrets/udmDataAdapterUsername"
    # -- Password for authenticating against the UDM REST API.
    # Do not use, see `secretRef` below.
    # Example: "password"
    udmDataAdapterPassword: ""
    # -- File where the UDM password will be stored.
    # Example: "/var/secrets/udmDataAdapterPassword"
    udmDataAdapterPasswordFile: "/var/secrets/udmDataAdapterPassword"
    # -- URL to Open Policy Agent.
    # Example: "http://ums-guardian-open-policy-agent:8181/"
    opaAdapterUrl: ""
    # -- OIDC well-known url
    # Example: "http://keycloak/realms/souvap/.well-known/openid-configuration"
    oauthAdapterWellKnownUrl: ""
    # -- Sets the log level of the application.
    # Chart defaults to: "DEBUG"
    guardianAuthzLoggingLevel: ""
    # -- If set to True, the logging output is structured as a JSON object.
    # Example: true
    guardianAuthzLoggingStructured: true
    # -- Defines the format of the log output, if not structured. The possible options are described in https://loguru.readthedocs.io/en/stable/api/logger.html.
    # Example: "<green>{time:YYYY-MM-DD HH:mm:ss.SSS ZZ}</green> | <level>{level}</level> | <level>{message}</level> | {extra}"
    guardianAuthzLoggingFormat: "<green>{time:YYYY-MM-DD HH:mm:ss.SSS ZZ}</green> | <level>{level}</level> | <level>{message}</level> | {extra}"
    # -- The reference to the secret containing `udmDataAdapterPassword` and `udmDataAdapterUsername` secret.
    # Example: "guardian-udm-secret"
    secretRef: ""

  service:
    enabled: true
    type: "ClusterIP"
    ports:
      http:
        containerPort: 8000
        port: 80
        protocol: "TCP"

    sessionAffinity:
      enabled: false
      timeoutSeconds: 10800

  resources:
    requests:
      memory: "512Mi"
      cpu: "250m"
    limits:
      memory: "4Gi"
      cpu: "4"

  probes:
    liveness:
      enabled: true
      initialDelaySeconds: 120
      timeoutSeconds: 3
      periodSeconds: 30
      failureThreshold: 3
      successThreshold: 1

    readiness:
      enabled: true
      initialDelaySeconds: 30
      timeoutSeconds: 3
      periodSeconds: 15
      failureThreshold: 30
      successThreshold: 1

  persistence:
    data:
      storageClass: ""
      size: "1Gi"


  ############################
  # END OF AUTHORIZATION API #
  ############################

##################
# MANAGEMENT API #
##################

# -- The Guardian management API
managementApi:
  affinity: {}
  environment: {}
  fullnameOverride: ""
  nameOverride: ""
  nodeSelector: {}
  podAnnotations: {}
  podSecurityContext:
    fsGroup: 1000
    # -- Change ownership and permission of the volume before being exposed inside a Pod.
    fsGroupChangePolicy: "Always"
  replicaCount: 1
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
      - ALL
    privileged: false
    readOnlyRootFilesystem: true
    runAsGroup: 1000
    runAsNonRoot: true
    runAsUser: 1000
    seccompProfile:
      type: RuntimeDefault
  tolerations: []

  image:
    imagePullPolicy: "Always"
    imagePullSecrets: []

    registry: "docker.software-univention.de"
    repository: "guardian-management-api-management-api"
    tag: "2.0.0"
    # -- Define image sha256 as an alternative to `tag`
    sha256: null

  config:
    # -- Directory that Guardian will use to save the bundles and configuration.
    home: "/guardian_service_dir"
    # -- Comma-separated list of hosts that are allowed to make cross-origin resource sharing (CORS) requests to the server.
    guardianManagementCorsAllowedOrigins: "*"
    # -- Port and adapter for where to get the settings from. Defaults to `env` to read from environment.
    guardianManagementAdapterSettingsPort: "env"
    # -- Port and adapter for persisting app data. Defaults to `sql`.
    guardianManagementAdapterAppPersistencePort: "sql"
    # -- Port and adapter for persisting conditions. Defaults to `sql`.
    guardianManagementAdapterConditionPersistencePort: "sql"
    # -- Port and adapter for persisting contexts. Defaults to `sql`.
    guardianManagementAdapterContextPersistencePort: "sql"
    # -- Port and adapter for persisting namespaces. Defaults to `sql`.
    guardianManagementAdapterNamespacePersistencePort: "sql"
    # -- Port and adapter for persisting permissions. Defaults to `sql`.
    guardianManagementAdapterPermissionPersistencePort: "sql"
    # -- Port and adapter for persisting roles. Defaults to `sql`.
    guardianManagementAdapterRolePersistencePort: "sql"
    # -- Port and adapter for persisting capabilities. Defaults to `sql`.
    guardianManagementAdapterCapabilityPersistencePort: "sql"
    # -- Port and adapter for authentication. Use `fast_api_oauth` for integrated OIDC support.
    guardianManagementAdapterAuthenticationPort: "fast_api_oauth"
    # -- URL to the Authorization API.
    # Example: http://guardian-management-api/guardian/authorization
    guardianManagementAdapterAuthorizationApiUrl: ""
    guardianManagementAdapterResourceAuthorizationPort: "guardian"
    isUniventionAppCenter: 0
    # -- Dialect of the database.
    sqlPersistenceAdapterDialect: "postgresql"
    # -- Identity Provider well known URL
    # Example: http://keycloak/realms/souvap/.well-known/openid-configuration
    oauthAdapterWellKnownUrl: ""
    # -- File where the machine-to-machine secret will be saved.
    oauthAdapterM2mSecretFile: "/var/secrets/oauthAdapterM2mSecret"
    # -- Machine-to-machine secret (not used, see `secretRef` below)
    oauthAdapterM2mSecret: ""
    # -- Sets the log level of the application.
    guardianManagementLoggingLevel: "DEBUG"
    # -- If set to True, the logging output is structured as a JSON object.
    guardianManagementLoggingStructured: true
    # -- Defines the format of the log output, if not structured. The possible options are described in https://loguru.readthedocs.io/en/stable/api/logger.html.
    guardianManagementLoggingFormat: "<green>{time:YYYY-MM-DD HH:mm:ss.SSS ZZ}</green> | <level>{level}</level> | <level>{message}</level> | {extra}"
    # -- Defines the base URL of the API. If unset the url is generated from hostname and domainname.
    # Example: "http://example.test/guardian/management"
    guardianManagementBaseUrl: ""
    # -- The reference to the secret containing `oauthAdapterM2mSecret` secret.
    secretRef: ""

  service:
    enabled: true
    type: "ClusterIP"
    ports:
      http:
        containerPort: 8000
        port: 80
        protocol: "TCP"

    sessionAffinity:
      enabled: false
      timeoutSeconds: 10800

  # -- Deployment resources for the listener container
  resources:
    requests:
      memory: "512Mi"
      cpu: "250m"
    limits:
      memory: "4Gi"
      cpu: "4"

  ## Container deployment probes
  probes:
    liveness:
      enabled: true
      initialDelaySeconds: 120
      timeoutSeconds: 3
      periodSeconds: 30
      failureThreshold: 3
      successThreshold: 1

    readiness:
      enabled: true
      initialDelaySeconds: 30
      timeoutSeconds: 3
      periodSeconds: 15
      failureThreshold: 30
      successThreshold: 1

  persistence:
    data:
      storageClass: ""
      size: "1Gi"

  #########################
  # END OF MANAGEMENT API #
  #########################

