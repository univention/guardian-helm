    # requests:
    #   memory: "512Mi"
    #   cpu: "250m"
    # limits:
    #   memory: "4Gi"
    #   cpu: "4"

  ## Container deployment probes
  probes:
    liveness:
      enabled: true
      initialDelaySeconds: 120
      timeoutSeconds: 3
      periodSeconds: 30
      failureThreshold: 3
      successThreshold: 1

    readiness:
      enabled: true
      initialDelaySeconds: 30
      timeoutSeconds: 3
      periodSeconds: 15
      failureThreshold: 30
      successThreshold: 1

  persistence:
    data:
      storageClass: ""
      size: "1Gi"

