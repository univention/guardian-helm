#####################
# OPEN POLICY AGENT #
#####################

openPolicyAgent:
  affinity: {}
  environment: {}
  fullnameOverride: ""
  nameOverride: ""
  nodeSelector: {}
  podAnnotations: {}
  podSecurityContext:
    fsGroup: 1000
    # -- Change ownership and permission of the volume before being exposed inside a Pod.
    fsGroupChangePolicy: "Always"
  replicaCount: 1
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
      - ALL
    privileged: false
    readOnlyRootFilesystem: true
    runAsGroup: 1000
    runAsNonRoot: true
    runAsUser: 1000
    seccompProfile:
      type: RuntimeDefault
  tolerations: []

  image:
    imagePullPolicy: "Always"
    imagePullSecrets: []

    registry: "docker.software-univention.de"
    repository: "guardian-authorization-api-opa"
    tag: "2.0.0"
    # -- Define image sha256 as an alternative to `tag`
    sha256: null

  config:
    isUniventionAppCenter: 0
    opaDataBundle: "bundles/GuardianDataBundle.tar.gz"
    opaPolicyBundle: "bundles/GuardianPolicyBundle.tar.gz"
    opaPollingMinDelay: 10
    opaPollingMaxDelay: 15
    # -- Bundle server URL
    opaGuardianManagementUrl: "http://guardian-management-api/guardian/management"

  ingress:
    # -- Set this to `true` in order to enable the installation on Ingress related objects.
    enabled: true
    ingressClassName: "nginx"
    host: null
    paths:
      - pathType: Prefix
        path: /guardian/opa
    tls:
      enabled: true
      secretName: ""

  service:
    enabled: true
    type: "ClusterIP"
    ports:
      http:
        containerPort: 8181
        port: 80
        protocol: "TCP"

    sessionAffinity:
      enabled: false
      timeoutSeconds: 10800

  # -- Deployment resources for the listener container
  resources: {}
    # requests:
    #   memory: "512Mi"
    #   cpu: "250m"
    # limits:
    #   memory: "4Gi"
    #   cpu: "4"

  ## Container deployment probes
  probes:
    liveness:
      enabled: true
      initialDelaySeconds: 120
      timeoutSeconds: 3
      periodSeconds: 30
      failureThreshold: 3
      successThreshold: 1

    readiness:
      enabled: true
      initialDelaySeconds: 30
      timeoutSeconds: 3
      periodSeconds: 15
      failureThreshold: 30
      successThreshold: 1

############################
# END OF OPEN POLICY AGENT #
############################


################
# provisioning #
################

# -- The Guardian Keycloak provisioning job
provisioning:
  restartPolicy: "OnFailure"
  backoffLimit: 900
  ttlSecondsAfterFinished: 300
  image:
    imagePullPolicy: "Always"
    imagePullSecrets: []

    registry: "gitregistry.knut.univention.de"
    repository: "univention/customers/dataport/upx/guardian-helm/guardian-init"
    tag: "0.3.0-pre-jconde-guardian-provisioning"
    # -- Define image sha256 as an alternative to `tag`
    sha256: null

  config:
    nubusBaseUrl: "https://portal.uv-example.gaia.open-desk.cloud/"
    keycloak:
      url: "http://ums-keycloak:8080"
      fqdn: "id.uv-example.gaia.open-desk.cloud/"
      realm: "opendesk"
      admin: "kcadmin"
  # -- The name of a secret that contains `KEYCLOAK_ADMIN_PASSWORD` and `GUARDIAN_MANAGEMENT_API_CLIENT_SECRET`
  credentialSecretName: "guardian-keycloak-secret"

  tolerations: []

#######################
# END OF PROVISIONING #
#######################


##############
# POSTGRESQL #
##############

# -- PostgreSQL settings.
#
# The bitnami helm chart does contain all details of what can be configured:
# https://github.com/bitnami/charts/tree/main/bitnami/postgresql
postgresql:
  nameOverride: "guardian-postgresql"
  # -- Set to `true` if you want PostgreSQL to be installed as well.
  bundled: true
  # -- Connection parameters. These are required if you use an external database.
  connection:
    host:
    port:
  auth:
    username: "guardian"
    database: "guardian"
    password: "guardian"
    postgresPassword: "guardian"


#################
# EXTRA SECRETS #
#################

# -- Optionally specify a secret to create (primarily intended to be used in development environments to provide custom certificates)
extraSecrets: []
  # - name: "guardian-keycloak-client-secret"
  #   stringData:
  #     oauthAdapterM2mSecret: "stub_client_secret"

  # - name: "guardian-keycloak-secret"
